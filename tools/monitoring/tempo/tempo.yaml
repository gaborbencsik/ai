# Tempo single-binary config. Stores traces (incl. GenAI prompt/completion span
# events) and serves TraceQL. Receives OTLP over gRPC from the OTel Collector.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # Retention window for traces. Matched to the cost-analysis window
    # (>= 30 days) so prompt content stays queryable for a month.
    block_retention: 720h    # 30 days

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
