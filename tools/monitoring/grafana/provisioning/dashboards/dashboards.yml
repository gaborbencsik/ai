apiVersion: 1

providers:
  - name: agent-dashboards
    orgId: 1
    folder: "Agent Usage"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # Claude Code / pi can write dashboard JSON straight into this folder;
      # Grafana auto-loads it, no copy-paste into the UI.
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
