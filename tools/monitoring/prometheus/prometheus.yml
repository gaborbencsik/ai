global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Staleness-safe recording rules for the bursty agent-session pattern
# (see recording-rules.yml) are loaded here.
rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  # Scrape the metrics the OTel Collector re-exports in Prometheus format.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Collector's own internal telemetry (optional, useful for debugging drops).
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
